
services:
  # ─── PostgreSQL 資料庫 ───
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Keycloak OIDC 身分提供者 ───
  # KC_HOSTNAME_URL 使用 host.docker.internal，讓「瀏覽器 (host)」與「admin 容器」都能透過同一個 URL 解析
  #   - Windows / Mac Docker Desktop：原生支援 host.docker.internal
  #   - Linux：需要在 host 的 /etc/hosts 加上 `127.0.0.1 host.docker.internal`
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kanban-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: host.docker.internal
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Redis（BullMQ 佇列 + 進度 pub/sub）───
  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 後台管理 (Next.js Admin) ───
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: kanban-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban_secret}@postgres:5432/${POSTGRES_DB:-kanban}?schema=public"
      NEXTAUTH_URL: http://localhost:3010
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-to-a-32-byte-random-string}
      AUTH_TRUST_HOST: "true"
      # Keycloak — issuer 必須與 token iss claim 一致；admin 容器透過 host-gateway 可解析此 URL
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-kanban-admin}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-kanban-admin-secret}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-http://host.docker.internal:8080/realms/kanban}
      # 帳密登入（Demo 主流程）
      AUTH_ALLOW_CREDENTIALS: ${AUTH_ALLOW_CREDENTIALS:-true}
      # Keycloak SSO 按鈕在登入頁是否顯示（預設關閉，避免被導去 Keycloak）
      NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED: ${NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED:-false}
      # entrypoint.sh nc 等待目標
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # 啟動時自動跑 seed（idempotent / upsert）；想跳過設為 false
      SEED_ON_START: ${SEED_ON_START:-true}
      # ─── Studio 影片工作室 ───
      REDIS_URL: redis://redis:6379
      STUDIO_STORAGE_ROOT: /studio-storage
      # 訪談 / 新增分鏡協助 LLM：LLM_PROVIDER 選 anthropic（預設）或 vertex（Gemini）
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      # Gemini on Vertex AI（僅 LLM_PROVIDER=vertex 時需要；GOOGLE_VERTEX_CREDENTIALS 放 service account JSON 整串）
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-global}
      GOOGLE_VERTEX_MODEL: ${GOOGLE_VERTEX_MODEL:-gemini-flash-latest}
      GOOGLE_VERTEX_CREDENTIALS: ${GOOGLE_VERTEX_CREDENTIALS:-}
      # GPU 佇列頁要讀 ComfyUI 原生 /queue（best-effort）；經 host-gateway 連回主機
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      # ─── 媒體庫（MinIO/S3 相容物件儲存，私密 + presigned URL）───
      # 私密模式：endpoint 與 public URL 都用「瀏覽器/容器都可達」的對外位址，presigned 才簽得對
      S3_ENDPOINT: ${S3_ENDPOINT:-https://minio.markkulab.net}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://minio.markkulab.net}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-studio-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports:
      - "3010:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - studio_storage:/studio-storage

  # ─── 影片生成 Worker (BullMQ + LangGraph + ffmpeg) ───
  # 同一個 admin/Dockerfile 的 worker 階段；跑在獨立容器，concurrency:1 = 單 GPU 排隊
  worker:
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: worker
    container_name: kanban-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban_secret}@postgres:5432/${POSTGRES_DB:-kanban}?schema=public"
      REDIS_URL: redis://redis:6379
      # ComfyUI / Seal-TTS / GPU 留主機；經 host-gateway 連回主機
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      COMFYUI_DIR: /comfyui
      SEAL_TTS_URL: ${SEAL_TTS_URL:-http://192.168.50.57:7866}
      SEAL_TTS_API_KEY: ${SEAL_TTS_API_KEY:-}
      STUDIO_STORAGE_ROOT: /studio-storage
      STUDIO_SDXL_CKPT: ${STUDIO_SDXL_CKPT:-juggernautXL_v9_V9 + RDPhoto 2.safetensors}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 主機 ComfyUI 目錄掛進來：worker 寫 input 供 ComfyUI 讀、讀 output 餵 ffmpeg
      - "${COMFYUI_DIR_HOST:-D:/BaiduNetdiskDownload/260518-WY-S130-ComfyUI/260518-WY-S130-ComfyUI/ComfyUI}:/comfyui"
      - studio_storage:/studio-storage

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  redis_data:
    driver: local
  studio_storage:
    driver: local
